[package]
name = "shiro-reader-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["query"] }
blake3 = "1.8.5"
bytes = "1.12.0"
jiff = { version = "0.2", features = ["serde"] }
dashmap = "6.2.1"
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from"] }
dotenvy = "0.15.7"
epub = "2.1.5"
futures-util = "0.3.32"
image = "0.25.10"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
pdfium-render = { version = "0.9.2" }
rayon = "1.12.0"
regex = "1.12.4"
rusqlite = "0.40"
securepass = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toasty = { version = "0.11.0", features = ["sqlite", "jiff"] }
toasty-core = "0.11.0"
toasty-driver-sqlite = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
bitflags = "2.13.2"
entity-derive = { path = "entity-derive" }

[dev-dependencies]
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
