[package]
name = "shiro-reader-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.44", features = ["serde"] }
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from"] }
dotenvy = "0.15.7"
o2o = "0.5.4"
sea-query = "0.32.7"
sea-query-binder = { version = "0.7.0", features = ["sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
