[package]
name = "shiro-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
default = []
identity = [
    "shiro-domain/identity",
    "shiro-application/identity",
    "dep:argon2",
    "dep:jsonwebtoken",
]

[dependencies]
anyhow.workspace = true
argon2 = { workspace = true, optional = true }
blake3.workspace = true
bytes.workspace = true
dashmap.workspace = true
futures-util.workspace = true
image.workspace = true
jiff.workspace = true
jsonwebtoken = { workspace = true, optional = true }
pdfium-render.workspace = true
rayon.workspace = true
rbook.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
shiro-application = { path = "../application" }
shiro-domain = { path = "../domain" }
tempfile.workspace = true
toasty.workspace = true
toasty-core.workspace = true
toasty-driver-sqlite.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "crypto"
required-features = ["identity"]
