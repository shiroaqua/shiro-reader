[workspace]
resolver = "2"
members = [
    "crates/entity-derive",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/error-catalog",
    "crates/http-contract",
    "crates/compatibility",
    "apps/server",
    "apps/client/src-tauri",
]

[workspace.package]
edition = "2024"
version = "0.0.1"
authors = ["Shiroaqua"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["query"] }
bitflags = "2.13.2"
blake3 = "1.8.7"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
dashmap = "6.2.1"
derive-new = "0.7.0"
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "display", "from", "into"] }
dotenvy = "0.15.7"
entity-derive = { path = "crates/entity-derive" }
flate2 = "1.1.11"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = "0.25.10"
jiff = { version = "1.0.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_7763", "image_latest", "thread_safe"] }
rayon = "1.12.0"
rbook = "0.7.13"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
rusqlite = "0.40"
securepass = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-os = "2.4.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toasty = { version = "0.11.0", features = ["sqlite"] }
toasty-core = "0.11.0"
toasty-driver-sqlite = "0.11.0"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.2"
toml_edit = "0.25.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }
