[package]
name = "shiro-compatibility"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ShiroReader client compatibility facade, settings store, startup state machine, local & cloud runtimes"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
futures-util.workspace = true
getrandom.workspace = true
pdfium-render.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shiro-application = { path = "../application", features = ["identity"] }
shiro-domain = { path = "../domain" }
shiro-error-catalog = { path = "../error-catalog", features = ["application"] }
shiro-http-contract = { path = "../http-contract" }
shiro-infrastructure = { path = "../infrastructure" }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
shiro-reader-server = { path = "../../apps/server" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
